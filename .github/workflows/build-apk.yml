name: Build Yape Alerta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YapeAlerta-Android-Proyecto.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip -q YapeAlerta-Android-Proyecto.zip -d proyecto
          cd proyecto/YapeAlerta-Android
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: YapeAlerta-APK
          path: proyecto/YapeAlerta-Android/app/build/outputs/apk/debug/app-debug.apk
